<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050507" />
  <title>FrameLab · Finger Modes</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050507;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #stage{position:fixed;inset:0;background:#000}video{display:none}canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    #status{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#09090b;font-weight:700}.hidden{opacity:0;pointer-events:none}
    #hint{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:8;padding:8px 12px;border-radius:999px;background:rgba(10,10,12,.55);backdrop-filter:blur(12px);font-size:13px;color:rgba(255,255,255,.82);transition:.25s;white-space:nowrap}
    #toolbar{position:fixed;z-index:10;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:7px;border:1px solid rgba(255,255,255,.13);border-radius:16px;background:rgba(18,18,22,.72);backdrop-filter:blur(16px);box-shadow:0 14px 36px rgba(0,0,0,.24)}
    .control{position:relative;min-width:132px;height:46px;border:1px solid rgba(255,255,255,.14);border-radius:11px;background:rgba(255,255,255,.09);color:#fff;padding:16px 38px 4px 12px;font:inherit;font-size:13px;font-weight:750;appearance:none;cursor:pointer}
    .wrap{position:relative}.label{position:absolute;z-index:2;left:12px;top:6px;font-size:9px;font-weight:800;letter-spacing:.09em;color:rgba(255,255,255,.45);pointer-events:none}.wrap:after{content:"⌄";position:absolute;right:13px;top:13px;color:rgba(255,255,255,.65);pointer-events:none}
    #effect-wrap{display:none}.single #effect-wrap{display:block}.multi #effect-wrap{display:none}
    button{height:46px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.09);color:#fff;padding:0 14px;font:inherit;font-size:13px;font-weight:750;cursor:pointer}button:hover,.control:hover{background:rgba(255,255,255,.14)}
    #reroll{display:none}.multi #reroll{display:block}#record{border-color:rgba(255,90,90,.35);background:rgba(130,25,25,.38)}#record.on{background:#d93434}
    #badge{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:8;padding:7px 10px;border-radius:999px;background:rgba(8,8,10,.54);backdrop-filter:blur(12px);font-size:11px;font-weight:800;letter-spacing:.08em;color:rgba(255,255,255,.78);opacity:0;transition:.25s}#badge.show{opacity:1}
    @media(max-width:640px){#toolbar{width:calc(100vw - 18px);bottom:9px;gap:5px;padding:5px}.control{min-width:0;width:100%}.wrap{flex:1 1 0}button{padding:0 10px}#hint{bottom:70px;max-width:calc(100vw - 24px);white-space:normal;text-align:center}}
  </style>
</head>
<body class="multi">
  <div id="stage"><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas></div>
  <div id="status">正在加载实时手势识别…</div>
  <div id="badge"></div>
  <div id="hint">选择模式后，把对应数量的手指张开并让双手进入画面。</div>
  <div id="toolbar">
    <label class="wrap"><span class="label">模式</span><select id="mode" class="control"><option value="two">双指</option><option value="three">三指</option><option value="four">四指</option><option value="five">五指</option><option value="single">单手</option></select></label>
    <label id="effect-wrap" class="wrap"><span class="label">单手效果</span><select id="single-effect" class="control"></select></label>
    <button id="reroll" title="重新随机一组效果">↻ 换一组</button>
    <button id="record">● 录制</button>
  </div>
<script type="module">
import { computeGestureZones } from './gesture-frame.mjs';

const TASKS='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const video=document.querySelector('#video'), canvas=document.querySelector('#canvas'), ctx=canvas.getContext('2d');
const modeSelect=document.querySelector('#mode'), singleSelect=document.querySelector('#single-effect'), hint=document.querySelector('#hint'), badge=document.querySelector('#badge');
const reroll=document.querySelector('#reroll'), record=document.querySelector('#record'), status=document.querySelector('#status');
const MODE_LABELS={two:'双指',three:'三指',four:'四指',five:'五指',single:'单手'};
const EFFECT_LABELS={holo:'镭射',mirror:'镜像',warp:'液态',rgb:'RGB',duotone:'双色',negative:'负片',thermal:'热成像',glitch:'故障',raster:'切片',neon:'霓虹',crt:'CRT',mono:'黑白',aura:'Aura',particles:'Particle',distort:'Distortion'};
const POOLS={
  two:['holo','mirror','warp','rgb'],
  three:['rgb','duotone','negative','thermal','holo'],
  four:['glitch','raster','neon','crt','rgb','negative'],
  five:['duotone','holo','neon','mono','rgb','crt','thermal','raster'],
};
const SINGLE=['aura','particles','distort','holo','neon','negative'];
SINGLE.forEach(id=>singleSelect.add(new Option(EFFECT_LABELS[id],id)));

let landmarker=null, lastVideoTime=-1, results=null, mode='two', zoneEffects=[], smoothZones=null, presence=0, lost=0, active=false;
let recorder=null, chunks=[];

function resize(){if(video.videoWidth && (canvas.width!==video.videoWidth||canvas.height!==video.videoHeight)){canvas.width=video.videoWidth;canvas.height=video.videoHeight}}
function drawCamera(c=ctx,w=canvas.width,h=canvas.height,dx=0){c.save();c.translate(w,0);c.scale(-1,1);c.drawImage(video,-dx,0,w,h);c.restore()}
function path(q){ctx.beginPath();ctx.moveTo(q[0].x,q[0].y);for(let i=1;i<q.length;i++)ctx.lineTo(q[i].x,q[i].y);ctx.closePath()}
function lerp(a,b,t){return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function centroid(q){return q.reduce((s,p)=>({x:s.x+p.x/q.length,y:s.y+p.y/q.length}),{x:0,y:0})}
function bbox(q){return{x0:Math.min(...q.map(p=>p.x)),x1:Math.max(...q.map(p=>p.x)),y0:Math.min(...q.map(p=>p.y)),y1:Math.max(...q.map(p=>p.y))}}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function roll(){if(mode==='single'){zoneEffects=[singleSelect.value];return}const count={two:1,three:2,four:3,five:4}[mode];const pool=shuffle(POOLS[mode]);while(pool.length<count)pool.push(...shuffle(POOLS[mode]));zoneEffects=pool.slice(0,count);showBadge(`${MODE_LABELS[mode]} · ${zoneEffects.map(x=>EFFECT_LABELS[x]).join(' / ')}`)}
function showBadge(text){badge.textContent=text;badge.classList.add('show');clearTimeout(showBadge.t);showBadge.t=setTimeout(()=>badge.classList.remove('show'),1800)}
function setMode(next){mode=next;document.body.className=mode==='single'?'single':'multi';smoothZones=null;presence=0;lost=0;active=false;roll();hint.textContent=mode==='single'?'张开一只手，单手效果可以自己选择。':`保持${MODE_LABELS[mode]}手势；每次进入会随机分配效果。`}
modeSelect.addEventListener('change',()=>setMode(modeSelect.value));singleSelect.addEventListener('change',()=>{zoneEffects=[singleSelect.value];showBadge(`单手 · ${EFFECT_LABELS[singleSelect.value]}`)});reroll.addEventListener('click',roll);

const fx=document.createElement('canvas'), fctx=fx.getContext('2d',{willReadFrequently:true});
function source(w,h){if(fx.width!==w||fx.height!==h){fx.width=w;fx.height=h}fctx.clearRect(0,0,w,h);drawCamera(fctx,w,h);return fx}
function filtered(filter,alpha=1,dx=0){ctx.filter=filter;ctx.globalAlpha=alpha;drawCamera(ctx,canvas.width,canvas.height,dx);ctx.filter='none';ctx.globalAlpha=1}
function effect(id,q,index){const w=canvas.width,h=canvas.height,t=performance.now()/1000,b=bbox(q),c=centroid(q);ctx.save();path(q);ctx.clip();ctx.globalAlpha=presence;
  if(id==='holo'){filtered('saturate(1.8) contrast(1.15)',.92);ctx.globalCompositeOperation='screen';for(let i=0;i<5;i++){const g=ctx.createLinearGradient(b.x0,b.y0,b.x1,b.y1);g.addColorStop(0,`hsla(${(t*40+i*62)%360},100%,68%,0)`);g.addColorStop(.5,`hsla(${(t*40+i*62+80)%360},100%,70%,.28)`);g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0)}}
  else if(id==='mirror'){const s=source(w,h);ctx.translate(c.x*2,0);ctx.scale(-1,1);ctx.drawImage(s,0,0)}
  else if(id==='warp'||id==='distort'){const s=source(w,h);for(let y=Math.floor(b.y0);y<b.y1;y+=5){const sh=Math.min(6,b.y1-y),shift=Math.sin(y*.035+t*3+index)*18;ctx.drawImage(s,b.x0,y,b.x1-b.x0,sh,b.x0+shift,y,b.x1-b.x0,sh)}}
  else if(id==='rgb'){ctx.globalCompositeOperation='screen';ctx.filter='saturate(2) contrast(1.25) hue-rotate(120deg)';ctx.globalAlpha=.55;drawCamera(ctx,w,h,8);ctx.filter='hue-rotate(245deg)';drawCamera(ctx,w,h,-8);ctx.filter='none';ctx.globalAlpha=.72;drawCamera(ctx,w,h)}
  else if(id==='duotone'){filtered('grayscale(1) contrast(1.75)',1);ctx.globalCompositeOperation='multiply';ctx.fillStyle=index%2?'#ff6da8':'#65e7ff';ctx.fillRect(0,0,w,h);ctx.globalCompositeOperation='screen';ctx.globalAlpha=.45;ctx.fillStyle=index%2?'#472a9d':'#ffb354';ctx.fillRect(0,0,w,h)}
  else if(id==='negative'){filtered('invert(1) hue-rotate(180deg) saturate(2) contrast(1.35)',1)}
  else if(id==='thermal'){filtered('grayscale(1) contrast(2.2)',1);const g=ctx.createLinearGradient(0,b.y1,0,b.y0);g.addColorStop(0,'#16002f');g.addColorStop(.35,'#005cff');g.addColorStop(.65,'#ff1478');g.addColorStop(1,'#fff347');ctx.globalCompositeOperation='screen';ctx.globalAlpha=.78;ctx.fillStyle=g;ctx.fillRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0)}
  else if(id==='glitch'){filtered('saturate(1.5) contrast(1.25)',1);const s=source(w,h);for(let i=0;i<9;i++){const y=b.y0+((Math.sin(i*91+Math.floor(t*10))*0.5+.5)*(b.y1-b.y0)),hh=5+(i*7)%22,shift=Math.sin(t*9+i)*34;ctx.drawImage(s,b.x0,y,b.x1-b.x0,hh,b.x0+shift,y,b.x1-b.x0,hh)}}
  else if(id==='raster'){const s=source(w,h);ctx.fillStyle='#07070b';ctx.fillRect(0,0,w,h);for(let y=Math.floor(b.y0);y<b.y1;y+=10){const shift=Math.sin(y*.07+t*5)*18;ctx.drawImage(s,b.x0,y,b.x1-b.x0,8,b.x0+shift,y,b.x1-b.x0,8)}}
  else if(id==='neon'){ctx.fillStyle='#04050a';ctx.fillRect(0,0,w,h);ctx.globalCompositeOperation='screen';ctx.filter='blur(18px) saturate(3) contrast(1.6) hue-rotate(140deg)';ctx.globalAlpha=.6;drawCamera(ctx,w,h,4);ctx.filter='saturate(2.6) contrast(1.7) hue-rotate(260deg)';ctx.globalAlpha=.72;drawCamera(ctx,w,h,-4);ctx.filter='none'}
  else if(id==='crt'){filtered('saturate(.8) contrast(1.35) brightness(.9)',1);ctx.fillStyle='rgba(0,0,0,.18)';for(let y=0;y<h;y+=5)ctx.fillRect(0,y,w,2)}
  else if(id==='mono'){filtered('grayscale(1) contrast(1.8)',1)}
  else if(id==='aura'){filtered('saturate(1.15) contrast(1.05)',1);ctx.globalCompositeOperation='screen';const r=Math.max(b.x1-b.x0,b.y1-b.y0)*.7,g=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,r);g.addColorStop(0,'rgba(120,255,230,.45)');g.addColorStop(.5,'rgba(150,95,255,.2)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(b.x0-r*.3,b.y0-r*.3,(b.x1-b.x0)+r*.6,(b.y1-b.y0)+r*.6)}
  else if(id==='particles'){filtered('brightness(.8) saturate(1.1)',1);ctx.globalCompositeOperation='screen';for(let i=0;i<70;i++){const a=i*2.399+t*(.15+(i%7)*.012),rad=((i*37)%100)/100*Math.max(b.x1-b.x0,b.y1-b.y0)*.6;ctx.fillStyle=i%2?'rgba(100,245,255,.7)':'rgba(255,110,225,.6)';ctx.beginPath();ctx.arc(c.x+Math.cos(a)*rad,c.y+Math.sin(a)*rad,1+(i%4),0,Math.PI*2);ctx.fill()}}
  ctx.restore();
}
function outline(q){ctx.save();ctx.globalAlpha=presence;path(q);ctx.lineWidth=1.4;ctx.strokeStyle='rgba(255,255,255,.72)';ctx.shadowColor='rgba(118,238,255,.42)';ctx.shadowBlur=7;ctx.stroke();ctx.shadowBlur=0;q.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.9)';ctx.fill()});ctx.restore()}

function smooth(target){if(!smoothZones||smoothZones.length!==target.length){smoothZones=target;return}let move=0,n=0;target.forEach((q,zi)=>q.forEach((p,pi)=>{move+=dist(p,smoothZones[zi][pi]);n++}));const alpha=Math.min(.86,Math.max(.3,(move/n)/(canvas.width*.045)));smoothZones=smoothZones.map((q,zi)=>q.map((p,pi)=>lerp(p,target[zi][pi],alpha)))}
function loop(now){resize();drawCamera();if(video.currentTime!==lastVideoTime){lastVideoTime=video.currentTime;results=landmarker.detectForVideo(video,now)}let zones=null;if(results?.landmarks?.length){zones=computeGestureZones(results.landmarks,{mode,active,width:canvas.width,height:canvas.height,mirrorX:true})}
  if(zones){if(!active){roll();active=true}lost=0;smooth(zones);presence=Math.min(1,presence+.14)}else if(smoothZones&&++lost<18){presence=Math.min(1,presence+.05)}else{presence=Math.max(0,presence-.07);if(!presence){smoothZones=null;active=false}}
  if(smoothZones&&presence>.01){smoothZones.forEach((q,i)=>{effect(zoneEffects[i%zoneEffects.length]||zoneEffects[0]||'holo',q,i);outline(q)})}
  hint.style.opacity=presence>.55?.22:1;requestAnimationFrame(loop)}

async function init(){setMode('two');const {HandLandmarker,FilesetResolver}=await import(TASKS);const fileset=await FilesetResolver.forVisionTasks(`${TASKS}/wasm`);landmarker=await HandLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:MODEL,delegate:'GPU'},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.3,minHandPresenceConfidence:.3,minTrackingConfidence:.3});const stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false});video.srcObject=stream;await video.play();resize();status.classList.add('hidden');requestAnimationFrame(loop)}
record.addEventListener('click',()=>{if(recorder?.state==='recording'){recorder.stop();return}if(!canvas.captureStream||!window.MediaRecorder)return;const stream=canvas.captureStream(30),mime=['video/mp4;codecs=avc1.42E01E','video/webm;codecs=vp9','video/webm'].find(MediaRecorder.isTypeSupported)||'';recorder=mime?new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:10000000}):new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=()=>{const type=recorder.mimeType||mime||'video/webm',ext=type.startsWith('video/mp4')?'mp4':'webm',url=URL.createObjectURL(new Blob(chunks,{type})),a=document.createElement('a');a.href=url;a.download=`FrameLab-finger-${Date.now()}.${ext}`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);stream.getTracks().forEach(t=>t.stop());record.classList.remove('on');record.textContent='● 录制'};recorder.start(1000);record.classList.add('on');record.textContent='■ 停止'});
init().catch(err=>{console.error(err);status.textContent=err.name==='NotAllowedError'?'摄像头权限被拒绝，请允许后刷新。':`启动失败：${err.message}`});
</script>
</body>
</html>

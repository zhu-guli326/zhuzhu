<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">FrameLab</title>
  <desc id="desc">A friendly colorful smiling face on a dark rounded square.</desc>

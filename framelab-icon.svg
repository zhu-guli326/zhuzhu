<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">FrameLab</title>
  <desc id="desc">Two hands framing a colorful video frame on a dark rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2d2d2d" />
      <stop offset="1" stop-color="#111" />
    </linearGradient>
    <linearGradient id="frame" x1="96" y1="100" x2="410" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9ab0" />
      <stop offset=".48" stop-color="#e8f4a5" />
      <stop offset="1" stop-color="#77dbe1" />
    </linearGradient>
    <linearGradient id="hand" x1="110" y1="100" x2="406" y2="418" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" />
      <stop offset=".52" stop-color="#fbe4df" />
      <stop offset="1" stop-color="#b8ece7" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dy="10" />
      <feComponentTransfer><feFuncA type="linear" slope=".32" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)" />

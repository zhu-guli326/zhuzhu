  <path d="M167 337V184c0-17 12-29 27-29s27 12 27 29v37h8V132c0-16 12-28 27-28s27 12 27 28v89h8V148c0-16 12-28 27-28s27 12 27 28v73h8v-38c0-16 12-28 27-28s27 12 27 28v104c0 38-29 68-68 68H221c-30 0-54-12-54-40Z" fill="url(#hand)" stroke="#fff" stroke-width="6" stroke-linejoin="round" filter="url(#shadow)" />
  <path d="M345 337V225c0-20-14-36-32-36h-62c-19 0-35 16-35 36v34" fill="none" stroke="#d8f6d6" stroke-width="11" stroke-linecap="round" opacity=".72" />
  <path d="M139 349V220c0-16-12-28-27-28s-27 12-27 28v80c0 40 30 72 70 72h63" fill="url(#hand)" stroke="#fff" stroke-width="6" stroke-linejoin="round" filter="url(#shadow)" />

  <path d="M196 197h120v112H196z" fill="#152821" fill-opacity=".52" stroke="url(#frame)" stroke-width="10" stroke-linejoin="round" />
  <path d="M373 78c8 25 18 35 43 43-25 8-35 18-43 43-8-25-18-35-43-43 25-8 35-18 43-43Z" fill="#fff" opacity=".92" />

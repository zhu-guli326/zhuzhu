<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">FrameLab</title>
  <desc id="desc">A soft rainbow ghost with a sparkle on a dark rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2d2d2d" />
      <stop offset="1" stop-color="#111" />
    </linearGradient>
    <radialGradient id="ghost" cx="35%" cy="42%" r="78%">
      <stop offset="0" stop-color="#fff" />
      <stop offset="0.28" stop-color="#ffe7ed" />
      <stop offset="0.46" stop-color="#ffc3d1" />
      <stop offset="0.62" stop-color="#e9f7bd" />
      <stop offset="0.8" stop-color="#b9f0e9" />
      <stop offset="1" stop-color="#a5d9e8" />
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".98" />
      <stop offset=".5" stop-color="#fff" stop-opacity=".32" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dy="10" />
      <feComponentTransfer><feFuncA type="linear" slope=".32" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)" />
  <path d="M373 78c8 25 18 35 43 43-25 8-35 18-43 43-8-25-18-35-43-43 25-8 35-18 43-43Z" fill="#fff" opacity=".92" />
  <path d="M236 112c-76 0-130 53-130 130 0 28 5 52 5 75 0 31-9 67-2 91 8 29 33 43 60 38 12-2 25-10 35-18 16 19 38 27 61 27 23 0 45-8 61-27 11 8 23 16 36 18 27 5 51-9 59-38 7-24-2-60-2-91 0-23 5-47 5-75 0-77-54-130-130-130Z" fill="url(#ghost)" stroke="#fff" stroke-width="6" filter="url(#shadow)" />
  <ellipse cx="211" cy="237" rx="22" ry="36" fill="#111" stroke="#fff" stroke-width="3" />
  <ellipse cx="283" cy="237" rx="22" ry="36" fill="#111" stroke="#fff" stroke-width="3" />
  <path d="M145 164c30-38 73-53 119-47-35 9-63 29-80 58-14 24-18 49-18 73-13-25-19-55-21-84Z" fill="url(#shine)" opacity=".72" filter="url(#soft)" />
</svg>
